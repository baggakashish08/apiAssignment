name: Documentation Update

on:
  push:
    branches:
      - main
  
  schedule:
    # Runs at 9 PM IST (3:30 PM UTC) every day
    - cron: '30 15 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: scai-runner-scale-set
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history to check commits
      
      - name: Get changed files
        id: commits
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # For scheduled runs: get files changed in last 24 hours
            SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
            FILES=$(git log --since="$SINCE" --name-only --pretty=format: -- '*.java' | sort -u | grep -v '^$' | tr '\n' ' ')
          else
            # For push: get files changed in this commit
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.java' 2>/dev/null | sort -u | tr '\n' ' ' || echo "")
          fi
          
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found changed files: $FILES"
      
      - name: Install Python (for ephemeral runners)
        if: steps.commits.outputs.files != ''
        run: |
          # Check if Python is available
          if ! command -v python3 &> /dev/null; then
            echo "Python not found, installing..."
            apt-get update && apt-get install -y python3 python3-pip python3-venv
          fi
          python3 --version
      
      - name: Setup Python
        if: steps.commits.outputs.files != ''
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        if: steps.commits.outputs.files != ''
        run: |
          python -m pip install --upgrade pip
          pip install openai
      
      - name: Generate documentation
        if: steps.commits.outputs.files != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_docs.py "${{ steps.commits.outputs.files }}"
      
      - name: Commit and push changes
        if: steps.commits.outputs.files != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add DOCS.md
          git diff --staged --quiet || git commit -m "docs: daily documentation update ($(date '+%Y-%m-%d'))"
          git push
      
      - name: No changes today
        if: steps.commits.outputs.files == ''
        run: echo "No Java files changed in the last 24 hours. Skipping documentation update."
