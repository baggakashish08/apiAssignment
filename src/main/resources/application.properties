#Server Port on which the Spring Boot App is running.
server.port = 8080

# MYSQL DataBase Configuration
spring.datasource.url =jdbc:mysql://localhost:3306/db_springjdbc
spring.datasource.username = root
spring.datasource.password = applicate
spring.datasource.driverClassName = com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.generate-ddl =true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect

# Test API Configuration
# Mode options: simple, detailed, debug
test.api.mode=simple
test.api.include-metadata=true
test.api.response-delay-ms=0
test.api.enabled=true
test.api.message-prefix=Test API
test.api.max-items=100
test.api.log-requests=false